<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>biTrader</title>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <div class="shell">
    <!-- ------------------------------------------------------ sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">bT</div>
        <div>
          <div class="brand-name">biTrader</div>
          <div class="brand-version" id="brandVersion">本地测试版</div>
        </div>
      </div>

      <nav class="nav" id="nav">
        <button class="nav-item" aria-current="page" data-page="trading">
          <svg class="nav-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M2 11.5 5.5 8l2.5 2.5L13.5 4.5" stroke="currentColor" stroke-width="1.4"
                  stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M10 4.5h3.5V8" stroke="currentColor" stroke-width="1.4"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>交易</span>
        </button>
        <button class="nav-item" data-page="portfolio">
          <svg class="nav-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <rect x="2.5" y="3.5" width="11" height="9" rx="1.5" stroke="currentColor" stroke-width="1.4"/>
            <path d="M2.5 6.5h11" stroke="currentColor" stroke-width="1.4"/>
          </svg>
          <span>资产</span>
        </button>
        <button class="nav-item" data-page="auto">
          <svg class="nav-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="1.4"/>
            <path d="M8 5v3.2l2 1.2" stroke="currentColor" stroke-width="1.4"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span>自动交易</span>
        </button>
        <button class="nav-item" data-page="backtest">
          <svg class="nav-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M3 13V8M8 13V3M13 13V6" stroke="currentColor" stroke-width="1.4"
                  stroke-linecap="round"/>
          </svg>
          <span>回测</span>
        </button>
        <button class="nav-item" data-page="settings">
          <svg class="nav-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <circle cx="8" cy="8" r="2.2" stroke="currentColor" stroke-width="1.4"/>
            <path d="M8 2v1.4M8 12.6V14M2 8h1.4M12.6 8H14M3.8 3.8l1 1M11.2 11.2l1 1M12.2 3.8l-1 1M4.8 11.2l-1 1"
                  stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          </svg>
          <span>设置</span>
        </button>
      </nav>

      <div class="sidebar-foot">
        <div class="account-card">
          <div class="account-card__label">
            <span>纸面账户</span>
            <span class="dot" id="accountDot"></span>
          </div>
          <div class="account-card__value num" id="accountEquity">—</div>
          <div class="account-card__hint">USDT · 模拟资金</div>
        </div>
      </div>
    </aside>

    <!-- --------------------------------------------------------- main -->
    <main class="main">
      <header class="topbar">
        <div class="page-title" id="pageTitle">交易</div>
        <div class="topbar-spacer"></div>
        <div class="topbar-meta">
          <span id="marketMeta">现货</span>
          <span class="faint">·</span>
          <span id="connMeta">连接中</span>
        </div>
      </header>

      <div class="content" id="content">
        <div class="banner" id="banner">
          <span id="bannerText"></span>
        </div>

        <!-- ------------------------------------------------ trading page -->
        <section class="page" id="page-trading">
          <div class="trading-layout">
            <div class="trading-main">
              <!-- symbol strip -->
              <div class="symbol-strip">
                <div class="symbol-picker">
                  <select class="select" id="symbolSelect" aria-label="交易对"></select>
                </div>
                <div class="symbol-price num" id="lastPrice">—</div>
                <div class="symbol-change num" id="priceChange">—</div>
                <div class="symbol-stats">
                  <div class="stat">
                    <span class="stat__label">24h 高</span>
                    <span class="stat__value num" id="dayHigh">—</span>
                  </div>
                  <div class="stat">
                    <span class="stat__label">24h 低</span>
                    <span class="stat__value num" id="dayLow">—</span>
                  </div>
                  <div class="stat">
                    <span class="stat__label">24h 量</span>
                    <span class="stat__value num" id="dayVolume">—</span>
                  </div>
                </div>
              </div>

              <!-- chart -->
              <div class="card chart-card">
                <div class="card__head">
                  <span class="card__title">K 线</span>
                  <div class="spacer"></div>
                  <div class="segmented" id="timeframes" role="group" aria-label="周期"></div>
                </div>
                <div class="chart-wrap">
                  <canvas id="chart"></canvas>
                  <div class="chart-legend">
                    <span>开 <b class="num" id="legendOpen">—</b></span>
                    <span>高 <b class="num" id="legendHigh">—</b></span>
                    <span>低 <b class="num" id="legendLow">—</b></span>
                    <span>收 <b class="num" id="legendClose">—</b></span>
                  </div>
                  <div class="chart-empty" id="chartEmpty">正在加载行情…</div>
                </div>
              </div>

              <!-- orders drawer -->
              <div class="drawer" id="drawer" data-open="false">
                <button class="drawer__head" id="drawerToggle" aria-expanded="false">
                  <span class="drawer__title">当前委托</span>
                  <span class="drawer__count num" id="drawerCount">0</span>
                  <span class="drawer__spacer"></span>
                  <svg class="drawer__chevron" viewBox="0 0 14 14" fill="none" aria-hidden="true">
                    <path d="M3.5 5.5 7 9l3.5-3.5" stroke="currentColor" stroke-width="1.5"
                          stroke-linecap="round" stroke-linejoin="round"/>
                  </svg>
                </button>
                <div class="drawer__body">
                  <div class="drawer__tabs" role="tablist">
                    <button class="drawer__tab" role="tab" aria-selected="true" data-tab="open">当前委托</button>
                    <button class="drawer__tab" role="tab" aria-selected="false" data-tab="trades">成交记录</button>
                    <button class="drawer__tab" role="tab" aria-selected="false" data-tab="positions">持仓</button>
                  </div>
                  <div id="drawerContent"></div>
                </div>
              </div>
            </div>

            <!-- -------------------------------------------------- rail -->
            <div class="trading-rail">
              <div class="card">
                <div class="card__head">
                  <span class="card__title">市场</span>
                  <div class="spacer"></div>
                  <div class="segmented" id="markets" role="group" aria-label="市场"></div>
                </div>
                <div class="book">
                  <div class="book__side book__side--bids">
                    <div class="book__head"><span>买盘</span><span>数量</span></div>
                    <div id="bids"></div>
                  </div>
                  <div class="book__side book__side--asks">
                    <div class="book__head"><span>卖盘</span><span>数量</span></div>
                    <div id="asks"></div>
                  </div>
                </div>
              </div>

              <div class="card ticket">
                <div class="card__head">
                  <span class="card__title">下单</span>
                  <div class="spacer"></div>
                  <div class="segmented" id="orderType" role="group" aria-label="订单类型">
                    <button data-type="limit" aria-pressed="true">限价</button>
                    <button data-type="market" aria-pressed="false">市价</button>
                  </div>
                </div>

                <div class="ticket__body">
                  <div class="ticket__field">
                    <label class="field-label" for="priceInput">价格</label>
                    <input class="input num" id="priceInput" type="text" inputmode="decimal"
                           placeholder="0.00" />
                  </div>

                  <div class="ticket__field">
                    <label class="field-label" for="sizeInput">数量</label>
                    <div class="ticket__row">
                      <input class="input num" id="sizeInput" type="text" inputmode="decimal"
                             placeholder="0.00" />
                      <div class="segmented" id="sizeMode" role="group" aria-label="数量单位">
                        <button data-mode="amount" aria-pressed="true">按币</button>
                        <button data-mode="quote" aria-pressed="false">按金额</button>
                      </div>
                    </div>
                  </div>

                  <div class="ticket__estimate">
                    <span id="estimateLabel">预计金额</span>
                    <strong class="num" id="estimateValue">—</strong>
                  </div>
                </div>

                <div class="ticket__actions">
                  <button class="btn btn--buy" id="buyBtn">买入</button>
                  <button class="btn btn--sell" id="sellBtn">卖出</button>
                </div>

                <div class="ticket__flash" id="ticketFlash" hidden></div>

                <div class="ticket__note">
                  纸面交易：使用本地模拟资金，不会向交易所发送订单。
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- ---------------------------------------- placeholder pages -->
        <section class="page" id="page-portfolio" hidden>
          <div class="placeholder">
            <h2>资产</h2>
            <p>页面骨架已就位。下一步接入现货与合约余额、持仓和盈亏统计。</p>
          </div>
        </section>
        <section class="page" id="page-auto" hidden>
          <div class="placeholder">
            <h2>自动交易</h2>
            <p>页面骨架已就位。下一步接入策略选择、运行状态与交易日志。</p>
          </div>
        </section>
        <section class="page" id="page-backtest" hidden>
          <div class="placeholder">
            <h2>回测</h2>
            <p>页面骨架已就位。下一步接入策略参数、回测曲线与指标结果。</p>
          </div>
        </section>
        <section class="page" id="page-settings" hidden>
          <div class="placeholder">
            <h2>设置</h2>
            <p>页面骨架已就位。下一步接入 API 凭据、风控参数与主题切换。</p>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
